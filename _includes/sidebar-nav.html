
<nav class="site-nav" aria-label="Documentation navigation">
  <h3>Explore</h3>

  <ul>
    {% for item in site.data.navigation %}
      <li>
        <a href="{{ item.url | relative_url }}">
          {{ item.title }}
        </a>

        {% if item.children %}
          <ul>
            {% for child in item.children %}
              <li>
                <a href="{{ child.url | relative_url }}">
                  {{ child.title }}
                </a>
              </li>
            {% endfor %}
          </ul>
        {% endif %}
      </li>
    {% endfor %}
  </ul>
</nav>
